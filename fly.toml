# Fly.io app config. Secrets (DATABASE_URL, SECRET_KEY_BASE,
# CONGRESS_GOV_API_KEY, PHX_HOST) are set with `fly secrets set`, never here.
app = "thefloor-vote"
primary_region = "iad"
kill_signal = "SIGTERM"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PORT = "8080"
  ECTO_IPV6 = "true"
  ERL_AFLAGS = "-proto_dist inet6_tcp"

# Oban runs the nightly ingest schedule inside the app, so one machine must
# stay up: auto-stop is off and one machine always runs.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
