name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      # fails on any dependency with a security advisory or retired by its
      # maintainers; acknowledge one that doesn't apply in mix.exs `hex:`
      - run: mix hex.audit
      - run: mix deps.unlock --check-unused
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only --ha=false --image-label git-${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # one tiny call to each Claude model in use, with the settings summaries
      # send: a setting a model refuses fails here, not silently in the jobs
      # through the Machines API: `ssh console` needs a WireGuard tunnel, which
      # times out from GitHub's runners
      - name: Check Claude answers
        run: |
          machine=$(flyctl machine list -a thefloor-vote --json | jq -r '[.[] | select(.state == "started")][0].id')
          result=$(flyctl machine exec "$machine" -a thefloor-vote --timeout 120 --json \
            "/app/bin/everyday_citizen rpc 'EverydayCitizen.Release.check_claude()'")
          echo "$result" | jq -r '.stdout // empty, .stderr // empty'
          # exit_code is left out of the JSON when it is 0
          test "$(echo "$result" | jq -r '.exit_code // 0')" = "0"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
